name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Single version, matching the Dockerfile's python:3.11-bookworm. The
    # requirements lock is compiled on that interpreter (see CLAUDE.md), so a
    # matrix leg on another version would be testing pins that never ship.
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Same system libraries the Dockerfile installs. pycairo builds from source
    # and needs the cairo headers; weasyprint needs pango and gdk-pixbuf.
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libcairo2 libcairo2-dev \
          libpango-1.0-0 libpango1.0-dev \
          libgdk-pixbuf-2.0-0 libgdk-pixbuf-2.0-dev \
          shared-mime-info

    - name: Cache pip dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install flake8==7.1.1

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

    - name: Run tests with pytest
      env:
        FLASK_SECRET_KEY: test-secret-key
      run: |
        export PYTHONPATH="${PYTHONPATH}:$(pwd)"
        pytest --cov=. --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Test application startup
      env:
        FLASK_SECRET_KEY: test-secret-key
      run: |
        python app.py &
        for i in $(seq 1 30); do
          curl -sf http://localhost:5000/ >/dev/null && break
          sleep 2
        done
        curl -sf http://localhost:5000/ >/dev/null || { echo "app did not come up"; exit 1; }
        pkill -f "python.*app.py"
