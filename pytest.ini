[pytest]
# Pytest configuration for molAOP Analyser
#
# NOTE: the section header must be [pytest]. It read [tool:pytest] until July 2026,
# which is only valid inside setup.cfg, so this entire file was silently ignored.

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --cov=.
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=75

# Markers for different test categories
markers =
    unit: Unit tests for individual components
    integration: Integration tests for workflows
    slow: Tests that take a long time to run
    database: Tests that require database access
    web: Tests that require web server

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning
