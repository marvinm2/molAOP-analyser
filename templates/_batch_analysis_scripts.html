<script>
'use strict';

// -------------------------------------------------------------------------
// State
// -------------------------------------------------------------------------
const MAX_FILES = 10;
const CSRF_TOKEN = '{{ csrf_token }}';

/** @type {Array<{name: string, size: number, isDemo: boolean, path?: string, meta?: object}>} */
let fileQueue = [];
/** batch_uuid returned by /batch/upload */
let batchUuid = null;
/** Polling interval handle */
let pollHandle = null;

// -------------------------------------------------------------------------
// Helpers
// -------------------------------------------------------------------------
function formatBytes(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function showError(id, msg) {
    const el = document.getElementById(id);
    if (el) { el.textContent = msg; el.style.display = 'block'; }
}
function hideError(id) {
    const el = document.getElementById(id);
    if (el) { el.style.display = 'none'; }
}

function setLogfcThreshold(val) {
    document.getElementById('logfc-threshold').value = val;
}

// -------------------------------------------------------------------------
// Step indicator
// -------------------------------------------------------------------------
function showStep(n) {
    document.querySelectorAll('.wizard-step').forEach(function(s) {
        s.classList.remove('wizard-step--active');
    });
    document.getElementById('step-' + ['upload', 'tag', 'metadata'][n - 1])
        .classList.add('wizard-step--active');

    document.querySelectorAll('.wizard-step-ind').forEach(function(ind) {
        const stepNum = parseInt(ind.dataset.step);
        ind.classList.remove('wizard-steps-indicator__item--active',
                             'wizard-steps-indicator__item--done');
        if (stepNum === n) {
            ind.classList.add('wizard-steps-indicator__item--active');
        } else if (stepNum < n) {
            ind.classList.add('wizard-steps-indicator__item--done');
        }
    });
}

// -------------------------------------------------------------------------
// Column confidence badge helpers (AUTC-01 / AUTC-02 — batch path)
// Explainer strings mirror the single-analysis wording so both upload paths
// give identical help.
// -------------------------------------------------------------------------
var COLUMN_EXPLAINERS = {
    id:   'Detector looks for: gene symbol name/format patterns (e.g. GAPDH, ENSG…), or Entrez integer IDs.',
    fc:   'Detector looks for: numeric values, log2-scale range (roughly −10 to +10), near-zero mean, both positive and negative values.',
    pval: 'Detector looks for: numeric values strictly in [0, 1], mix of significant and non-significant values, absence of exact 0 or 1 values.'
};

/**
 * Build a confidence badge <span> using safe DOM construction only.
 * Badge label goes through textContent; explainer tooltip via the .title
 * DOM property — never innerHTML, so a malicious CSV header cannot inject markup.
 */
function makeConfidenceBadge(labelText, levelClass, tooltipText) {
    var span = document.createElement('span');
    span.className = 'confidence-badge confidence-badge--' + levelClass;
    span.textContent = labelText;
    span.title = tooltipText;
    return span;
}

// -------------------------------------------------------------------------
// File queue rendering
// -------------------------------------------------------------------------
function renderFileList() {
    const container = document.getElementById('file-list');
    container.innerHTML = '';
    fileQueue.forEach(function(entry, idx) {
        const card = document.createElement('div');
        card.className = 'file-card';

        const icon = document.createElement('span');
        icon.className = 'file-card__icon';
        icon.textContent = entry.isDemo ? '&#128203;' : '&#128196;';
        icon.innerHTML = entry.isDemo ? '&#128203;' : '&#128196;';

        const info = document.createElement('div');
        info.className = 'file-card__info';

        const name = document.createElement('div');
        name.className = 'file-card__name';
        name.textContent = entry.name;

        const meta = document.createElement('div');
        meta.className = 'file-card__meta';

        // Base info: size or demo label, plus row count after upload
        var baseParts = [];
        if (entry.isDemo) {
            baseParts.push('Demo file');
        } else {
            baseParts.push(formatBytes(entry.size));
        }
        if (entry.rowCount != null) {
            baseParts.push(entry.rowCount + ' rows');
        }
        meta.appendChild(document.createTextNode(baseParts.join('  \u2014  ')));

        // Detected columns: render inline confidence badges after upload.
        // Column names go through createTextNode; badge text through textContent;
        // explainer tooltip through .title \u2014 no innerHTML used on CSV-derived values.
        if (entry.suggestions) {
            var colDefs = [
                { key: 'id',   prefix: 'ID' },
                { key: 'fc',   prefix: 'FC' },
                { key: 'pval', prefix: 'p'  }
            ];
            colDefs.forEach(function(def) {
                var colName    = entry.suggestions[def.key + '_col'];
                var confidence = entry.suggestions[def.key + '_confidence'];
                var label      = entry.suggestions[def.key + '_label'];
                var explainer  = COLUMN_EXPLAINERS[def.key];

                meta.appendChild(document.createTextNode('  \u2014  ' + def.prefix + ': '));

                if (colName) {
                    meta.appendChild(document.createTextNode(colName + ' '));
                    var pct = Math.round((confidence || 0) * 100);
                    var levelClass = (label || '').toLowerCase().replace(' ', '-');
                    meta.appendChild(makeConfidenceBadge(label + ' ' + pct + '%', levelClass, explainer));
                } else {
                    meta.appendChild(makeConfidenceBadge('Not detected', 'undetected', explainer));
                }
            });
        }

        info.appendChild(name);
        info.appendChild(meta);

        // Head preview table (populated after upload, absent pre-upload)
        if (entry.headRows && entry.headRows.length > 0) {
            var headWrap = document.createElement('div');
            headWrap.className = 'file-card__head';

            var tbl = document.createElement('table');
            // Header row from first entry's keys
            var thead = document.createElement('thead');
            var hrow = document.createElement('tr');
            Object.keys(entry.headRows[0]).forEach(function(col) {
                var th = document.createElement('th');
                th.textContent = col;
                hrow.appendChild(th);
            });
            thead.appendChild(hrow);
            tbl.appendChild(thead);

            // Data rows
            var tbody = document.createElement('tbody');
            entry.headRows.forEach(function(row) {
                var tr = document.createElement('tr');
                Object.values(row).forEach(function(val) {
                    var td = document.createElement('td');
                    td.textContent = val === null || val === undefined ? '' : String(val);
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            tbl.appendChild(tbody);

            headWrap.appendChild(tbl);
            info.appendChild(headWrap);
        }

        const removeBtn = document.createElement('button');
        removeBtn.className = 'file-card__remove';
        removeBtn.setAttribute('aria-label', 'Remove ' + entry.name);
        removeBtn.innerHTML = '&times;';
        removeBtn.type = 'button';
        removeBtn.dataset.idx = idx;
        removeBtn.addEventListener('click', function() {
            // Un-check demo checkbox if applicable
            if (fileQueue[idx].isDemo) {
                const cbs = document.querySelectorAll('.demo-cb');
                cbs.forEach(function(cb) {
                    if (cb.dataset.path === fileQueue[idx].path) cb.checked = false;
                });
            }
            fileQueue.splice(idx, 1);
            renderFileList();
            updateNextTagButton();
        });

        card.appendChild(icon);
        card.appendChild(info);
        card.appendChild(removeBtn);
        container.appendChild(card);
    });

    // Update count hint
    const hint = document.getElementById('file-count-hint');
    if (hint) {
        hint.textContent = fileQueue.length > 0
            ? fileQueue.length + ' file' + (fileQueue.length !== 1 ? 's' : '') + ' selected (max 10)'
            : '';
    }
}

function updateNextTagButton() {
    const btn = document.getElementById('btn-next-tag');
    btn.disabled = fileQueue.length < 1;  // Allow 1+ for testing; plan says 2-10
}

function addFiles(files) {
    let errMsg = '';
    Array.from(files).forEach(function(file) {
        if (fileQueue.length >= MAX_FILES) {
            errMsg = 'Maximum ' + MAX_FILES + ' files allowed.';
            return;
        }
        // Check for duplicate filename
        const exists = fileQueue.some(function(e) { return e.name === file.name; });
        if (exists) return;
        fileQueue.push({ name: file.name, size: file.size, isDemo: false, fileObj: file });
    });
    if (errMsg) showError('batch-error-upload', errMsg);
    renderFileList();
    updateNextTagButton();
}

// -------------------------------------------------------------------------
// Drop zone
// -------------------------------------------------------------------------
(function() {
    var dz = document.getElementById('batch-drop-zone');
    var fi = document.getElementById('batch-file-input');
    if (!dz || !fi) return;

    dz.addEventListener('click', function() { fi.click(); });
    dz.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fi.click(); }
    });
    dz.addEventListener('dragover', function(e) {
        e.preventDefault();
        dz.classList.add('drop-zone--active');
    });
    dz.addEventListener('dragleave', function() {
        dz.classList.remove('drop-zone--active');
    });
    dz.addEventListener('drop', function(e) {
        e.preventDefault();
        dz.classList.remove('drop-zone--active');
        addFiles(e.dataTransfer.files);
    });
    fi.addEventListener('change', function() {
        addFiles(fi.files);
        fi.value = '';  // Reset so same files can be re-selected
    });
})();

// -------------------------------------------------------------------------
// Demo checkboxes
// -------------------------------------------------------------------------
document.querySelectorAll('.demo-cb').forEach(function(cb) {
    cb.addEventListener('change', function() {
        if (cb.checked) {
            if (fileQueue.length >= MAX_FILES) {
                showError('batch-error-upload', 'Maximum ' + MAX_FILES + ' files allowed.');
                cb.checked = false;
                return;
            }
            hideError('batch-error-upload');
            const fileName = cb.dataset.path.split('/').pop();
            fileQueue.push({
                name: fileName,
                size: 0,
                isDemo: true,
                path: cb.dataset.path,
                meta: {
                    condition_label: cb.dataset.label,
                    dose: cb.dataset.dose,
                    timepoint: cb.dataset.timepoint,
                },
            });
        } else {
            fileQueue = fileQueue.filter(function(e) { return e.path !== cb.dataset.path; });
        }
        renderFileList();
        updateNextTagButton();
    });
});

// -------------------------------------------------------------------------
// Step 1 → Step 2: Upload files to server, get column suggestions
// -------------------------------------------------------------------------
document.getElementById('btn-next-tag').addEventListener('click', function() {
    hideError('batch-error-upload');
    if (fileQueue.length === 0) {
        showError('batch-error-upload', 'Please add at least one file.');
        return;
    }

    const btn = document.getElementById('btn-next-tag');
    btn.disabled = true;
    btn.textContent = 'Uploading...';

    const formData = new FormData();
    formData.append('csrf_token', CSRF_TOKEN);

    // Append real files
    fileQueue.forEach(function(entry) {
        if (!entry.isDemo && entry.fileObj) {
            formData.append('files[]', entry.fileObj, entry.name);
        }
    });

    // Append demo paths
    fileQueue.forEach(function(entry) {
        if (entry.isDemo) {
            formData.append('demo_files[]', entry.path);
        }
    });

    fetch('/batch/upload', {
        method: 'POST',
        headers: {'X-CSRFToken': CSRF_TOKEN},
        body: formData,
    })
    .then(function(resp) {
        if (!resp.ok) return resp.text().then(function(t) { throw new Error(t); });
        return resp.json();
    })
    .then(function(data) {
        batchUuid = data.batch_uuid;

        // Update file queue with server-side info (row counts, column suggestions, head preview)
        data.files.forEach(function(serverFile) {
            const entry = fileQueue.find(function(e) { return e.name === serverFile.filename; });
            if (entry) {
                entry.rowCount = serverFile.row_count;
                entry.columns = serverFile.columns;
                entry.suggestions = serverFile.suggestions;
                entry.headRows = serverFile.head_rows || [];
            }
        });

        // Auto-populate column fields from first file's suggestions
        const firstSuggestions = data.files[0] && data.files[0].suggestions;
        if (firstSuggestions) {
            if (firstSuggestions.id_col) document.getElementById('col-id').value = firstSuggestions.id_col;
            if (firstSuggestions.fc_col) document.getElementById('col-fc').value = firstSuggestions.fc_col;
            if (firstSuggestions.pval_col) document.getElementById('col-pval').value = firstSuggestions.pval_col;
        }

        // Re-render file cards with row counts
        renderFileList();

        // Build tagging form
        buildTagForm();

        showStep(2);
        btn.disabled = false;
        btn.textContent = 'Next: Tag Conditions';
    })
    .catch(function(err) {
        showError('batch-error-upload', 'Upload failed: ' + err.message);
        btn.disabled = false;
        btn.textContent = 'Next: Tag Conditions';
        updateNextTagButton();
    });
});

// -------------------------------------------------------------------------
// Build tagging form (Step 2)
// -------------------------------------------------------------------------
function buildTagForm() {
    const container = document.getElementById('tag-form-container');
    container.innerHTML = '';

    fileQueue.forEach(function(entry, idx) {
        const row = document.createElement('div');
        row.className = 'tag-row';
        row.dataset.idx = idx;

        const fname = document.createElement('div');
        fname.className = 'tag-row__filename';
        fname.textContent = entry.name +
            (entry.rowCount != null ? '  \u2014  ' + entry.rowCount + ' rows' : '');
        row.appendChild(fname);

        // Condition label (required)
        const condField = document.createElement('div');
        condField.className = 'tag-field';
        const condLabel = document.createElement('label');
        condLabel.textContent = 'Condition label *';
        condLabel.setAttribute('for', 'cond-label-' + idx);
        const condInput = document.createElement('input');
        condInput.type = 'text';
        condInput.id = 'cond-label-' + idx;
        condInput.name = 'condition_labels[]';
        condInput.required = true;
        condInput.placeholder = 'e.g. Treatment A';
        if (entry.meta && entry.meta.condition_label) condInput.value = entry.meta.condition_label;
        condField.appendChild(condLabel);
        condField.appendChild(condInput);

        // Dose (optional)
        const doseField = document.createElement('div');
        doseField.className = 'tag-field';
        const doseLabel = document.createElement('label');
        doseLabel.textContent = 'Dose (optional)';
        doseLabel.setAttribute('for', 'dose-' + idx);
        const doseInput = document.createElement('input');
        doseInput.type = 'text';
        doseInput.id = 'dose-' + idx;
        doseInput.name = 'doses[]';
        doseInput.placeholder = 'e.g. 10uM';
        if (entry.meta && entry.meta.dose) doseInput.value = entry.meta.dose;
        doseField.appendChild(doseLabel);
        doseField.appendChild(doseInput);

        // Timepoint (optional)
        const tpField = document.createElement('div');
        tpField.className = 'tag-field';
        const tpLabel = document.createElement('label');
        tpLabel.textContent = 'Timepoint (optional)';
        tpLabel.setAttribute('for', 'tp-' + idx);
        const tpInput = document.createElement('input');
        tpInput.type = 'text';
        tpInput.id = 'tp-' + idx;
        tpInput.name = 'timepoints[]';
        tpInput.placeholder = 'e.g. 24hr';
        if (entry.meta && entry.meta.timepoint) tpInput.value = entry.meta.timepoint;
        tpField.appendChild(tpLabel);
        tpField.appendChild(tpInput);

        row.appendChild(condField);
        row.appendChild(doseField);
        row.appendChild(tpField);

        // Collapsible data preview (first 5 rows from upload)
        if (entry.headRows && entry.headRows.length > 0) {
            var preview = document.createElement('details');
            preview.className = 'tag-row__preview';
            var summary = document.createElement('summary');
            summary.textContent = 'Preview (' + entry.headRows.length + ' rows)';
            preview.appendChild(summary);

            var tbl = document.createElement('table');
            var thead = document.createElement('thead');
            var hrow = document.createElement('tr');
            Object.keys(entry.headRows[0]).forEach(function(col) {
                var th = document.createElement('th');
                th.textContent = col;
                hrow.appendChild(th);
            });
            thead.appendChild(hrow);
            tbl.appendChild(thead);

            var tbody = document.createElement('tbody');
            entry.headRows.forEach(function(r) {
                var tr = document.createElement('tr');
                Object.values(r).forEach(function(val) {
                    var td = document.createElement('td');
                    td.textContent = val === null || val === undefined ? '' : String(val);
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            tbl.appendChild(tbody);
            preview.appendChild(tbl);
            row.appendChild(preview);
        }

        container.appendChild(row);
    });
}

// -------------------------------------------------------------------------
// Step navigation: back buttons
// -------------------------------------------------------------------------
document.getElementById('btn-back-upload').addEventListener('click', function() { showStep(1); });
document.getElementById('btn-back-tag').addEventListener('click', function() { showStep(2); });

// -------------------------------------------------------------------------
// Step 2 → Step 3
// -------------------------------------------------------------------------
document.getElementById('btn-next-metadata').addEventListener('click', function() {
    hideError('batch-error-tag');

    // Validate all condition labels are filled
    const labels = document.querySelectorAll('[name="condition_labels[]"]');
    let valid = true;
    labels.forEach(function(lbl) {
        if (!lbl.value.trim()) { valid = false; }
    });
    if (!valid) {
        showError('batch-error-tag', 'Please provide a condition label for each file.');
        return;
    }

    // Validate column names are set
    const idCol = document.getElementById('col-id').value.trim();
    const fcCol = document.getElementById('col-fc').value.trim();
    const pvalCol = document.getElementById('col-pval').value.trim();
    if (!idCol || !fcCol || !pvalCol) {
        showError('batch-error-tag', 'Please specify all three column names (Gene ID, log2FC, p-value).');
        return;
    }

    showStep(3);
});

// -------------------------------------------------------------------------
// Step 3: Start Batch Analysis
// -------------------------------------------------------------------------
document.getElementById('btn-analyze').addEventListener('click', function() {
    hideError('batch-error-meta');

    const aopId = document.getElementById('aop-hidden').value.trim();
    if (!aopId) {
        showError('batch-error-meta', 'Please select an AOP before starting analysis.');
        return;
    }

    if (!batchUuid) {
        showError('batch-error-meta', 'Session expired — please go back to Step 1 and re-upload files.');
        return;
    }

    const btn = document.getElementById('btn-analyze');
    btn.disabled = true;
    btn.textContent = 'Starting...';

    // Collect condition labels, doses, timepoints from tagging form
    const conditionLabels = Array.from(document.querySelectorAll('[name="condition_labels[]"]'))
        .map(function(el) { return el.value.trim(); });
    const doses = Array.from(document.querySelectorAll('[name="doses[]"]'))
        .map(function(el) { return el.value.trim(); });
    const timepoints = Array.from(document.querySelectorAll('[name="timepoints[]"]'))
        .map(function(el) { return el.value.trim(); });
    const filenames = fileQueue.map(function(e) { return e.name; });

    const payload = new FormData();
    payload.append('csrf_token', CSRF_TOKEN);
    payload.append('batch_uuid', batchUuid);
    payload.append('aop_selection', aopId);
    payload.append('logfc_threshold', document.getElementById('logfc-threshold').value);
    payload.append('pval_threshold', document.getElementById('pval-threshold').value);
    document.querySelectorAll('.batch-resource:checked').forEach(function(cb) {
        payload.append('resources', cb.value);
    });
    // Issue #60: minimum KE-mapping confidence, applied to every condition.
    const minConfidenceEl = document.getElementById('batch-min-confidence');
    payload.append('min_confidence', minConfidenceEl ? minConfidenceEl.value : 'all');
    payload.append('batch_name', document.getElementById('batch-name').value.trim());
    payload.append('owner', document.getElementById('batch-owner').value.trim());
    payload.append('description', document.getElementById('batch-desc').value.trim());
    payload.append('id_col', document.getElementById('col-id').value.trim());
    payload.append('fc_col', document.getElementById('col-fc').value.trim());
    payload.append('pval_col', document.getElementById('col-pval').value.trim());

    filenames.forEach(function(n) { payload.append('filenames[]', n); });
    conditionLabels.forEach(function(v) { payload.append('condition_labels[]', v); });
    doses.forEach(function(v) { payload.append('doses[]', v); });
    timepoints.forEach(function(v) { payload.append('timepoints[]', v); });

    fetch('/batch/analyze', {
        method: 'POST',
        headers: {'X-CSRFToken': CSRF_TOKEN},
        body: payload,
    })
    .then(function(resp) {
        if (!resp.ok) return resp.text().then(function(t) { throw new Error(t); });
        return resp.json();
    })
    .then(function(data) {
        if (data.warning_low_genes) {
            document.getElementById('batch-warning-harmonised').textContent = data.warning_low_genes;
            document.getElementById('batch-warning-harmonised').style.display = 'block';
        }
        // Show progress modal and start polling
        showProgressModal(data.batch_uuid, data.conditions || filenames);
    })
    .catch(function(err) {
        showError('batch-error-meta', 'Analysis failed: ' + err.message);
        btn.disabled = false;
        btn.textContent = 'Start Batch Analysis';
    });
});

// -------------------------------------------------------------------------
// Progress modal + htmx polling
// -------------------------------------------------------------------------
function showProgressModal(uuid, conditionNames) {
    const modal = document.getElementById('batch-progress-modal');
    const container = document.getElementById('batch-progress-container');

    // Inject an htmx-polling div — the server will replace it every second
    // with the batch_progress.html partial, and send HX-Redirect when done.
    container.innerHTML =
        '<div id="batch-progress-container"' +
        '     hx-get="/batch/' + encodeURIComponent(uuid) + '/status"' +
        '     hx-trigger="every 1s"' +
        '     hx-target="#batch-progress-container"' +
        '     hx-swap="outerHTML">' +
        '<p>Starting batch analysis...</p>' +
        '</div>';

    modal.style.display = 'flex';

    // Activate htmx on the dynamically inserted element so polling begins
    htmx.process(document.getElementById('batch-progress-container'));
}

function escapeHtml(str) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
}

// Cancel button — stop htmx polling and POST the cancel request
document.getElementById('btn-cancel-batch').addEventListener('click', function() {
    if (!batchUuid) return;

    // Remove htmx attributes from the polling container so polling stops immediately
    const container = document.getElementById('batch-progress-container');
    if (container) {
        container.removeAttribute('hx-get');
        container.removeAttribute('hx-trigger');
        htmx.process(container); // re-process to deactivate
    }

    fetch('/batch/' + batchUuid + '/cancel', {
        method: 'POST',
        headers: { 'X-CSRFToken': CSRF_TOKEN },
    }).finally(function() {
        document.getElementById('batch-progress-modal').style.display = 'none';
        document.getElementById('btn-analyze').disabled = false;
        document.getElementById('btn-analyze').textContent = 'Start Batch Analysis';
    });
});

// -------------------------------------------------------------------------
// AOP typeahead — reused from index.html pattern
// -------------------------------------------------------------------------
(function() {
    var searchInput = document.getElementById('aop-search');
    var hiddenInput = document.getElementById('aop-hidden');
    var suggestions = document.getElementById('aop-suggestions');

    if (!searchInput || !hiddenInput || !suggestions) return;

    var debounceTimer;

    function formatLabel(aop) {
        var mappedInfo = aop.mapped_ke_count > 0
            ? ' -- ' + aop.mapped_ke_count + '/' + aop.ke_count + ' KEs mapped'
            : '';
        return aop.aop_id + ': ' + aop.title + ' (' + aop.ke_count + ' KEs' + mappedInfo + ')';
    }

    function renderSuggestions(aops) {
        suggestions.innerHTML = '';

        if (!Array.isArray(aops) && aops.error) {
            var li = document.createElement('li');
            li.textContent = aops.error;
            li.style.color = '#EB5B25';
            li.style.cursor = 'default';
            suggestions.appendChild(li);
            suggestions.hidden = false;
            return;
        }

        if (!Array.isArray(aops) || aops.length === 0) {
            suggestions.hidden = true;
            return;
        }

        aops.forEach(function(aop) {
            var li = document.createElement('li');
            var mainText = document.createElement('span');
            mainText.textContent = aop.aop_id + ': ' + aop.title + ' (' + aop.ke_count + ' KEs)';
            li.appendChild(mainText);

            if (aop.mapped_ke_count > 0) {
                var info = document.createElement('span');
                info.className = 'mapped-info';
                info.textContent = ' -- ' + aop.mapped_ke_count + '/' + aop.ke_count + ' KEs mapped';
                li.appendChild(info);
            }

            li.dataset.id = aop.aop_id;
            li.addEventListener('click', function() {
                hiddenInput.value = aop.aop_id;
                searchInput.value = formatLabel(aop);
                suggestions.hidden = true;
            });
            suggestions.appendChild(li);
        });
        suggestions.hidden = false;
    }

    function fetchSuggestions(q) {
        fetch('/api/aops?q=' + encodeURIComponent(q))
            .then(function(r) { return r.json(); })
            .then(renderSuggestions)
            .catch(function(e) { renderSuggestions({ error: 'Failed to load AOPs: ' + e.message }); });
    }

    searchInput.addEventListener('input', function() {
        hiddenInput.value = '';
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(function() {
            fetchSuggestions(searchInput.value.trim());
        }, 250);
    });

    searchInput.addEventListener('focus', function() {
        if (!searchInput.value.trim()) fetchSuggestions('');
    });

    document.addEventListener('click', function(e) {
        if (!e.target.closest('.typeahead-wrapper')) suggestions.hidden = true;
    });
})();
</script>
