<script>
    // Volcano plot data and configuration from Flask backend.
    // Wrapped in IIFE so re-execution on HTMX swap doesn't redeclare top-level `const`s
    // (which would throw a SyntaxError and silently break Plotly.newPlot on threshold change).
    // volcanoData is exposed on `window` so setPercentageThreshold can still read it.
    (function () {
    {% if volcano_data %}
    window.volcanoData = {{ volcano_data | tojson }};
    const volcanoData = window.volcanoData;
    // Issue #64: Top N% thresholds are computed server-side over the FULL
    // dataset. volcanoData is capped at Config.MAX_GENES_DISPLAY, so deriving
    // them here would use a truncated subset on any larger upload.
    window.logfcPercentiles = {{ logfc_percentiles | default({}) | tojson }};
    const threshold = {{ logfc_threshold or 'null' }};
    const pvalThreshold = {{ pval_cutoff }};
    const pvalY = {{ pval_y | default(1.3) | float }};

    // Configure Plotly scatter plot trace for volcano visualization
    const trace = {
        x: volcanoData.map(d => d.log2FC),  // X-axis: log2 fold change values
        y: volcanoData.map(d => -Math.log10(d.pval)),  // Y-axis: -log10 p-values
        text: volcanoData.map(d => d.ID),  // Gene identifiers for hover labels
        mode: 'markers',
        type: 'scatter',
        marker: {
            size: 6,
            opacity: 0.7,
            // Color-code points based on statistical significance and fold change
            color: volcanoData.map(d => {
                const fc = parseFloat(d.log2FC);
                const pval = parseFloat(d.pval);
                if (isNaN(fc) || isNaN(pval)) return 'gray';  // Invalid data

                const sigPval = pval < pvalThreshold;  // Statistically significant p-value
                const sigLeft = sigPval && fc <= -threshold;  // Significantly downregulated
                const sigRight = sigPval && fc >= threshold;  // Significantly upregulated
                const absFC = Math.abs(fc);

                if (sigLeft) return 'blue';      // Downregulated genes
                if (sigRight) return 'red';      // Upregulated genes
                if (sigPval && absFC < threshold) return 'green';  // Significant but low fold change
                return 'lightgray';  // Not statistically significant
            })
        },
        hovertemplate: 'Gene: %{text}<br>log2FC: %{x}<br>-log10(p): %{y}<extra></extra>'
    };

    // Calculate data range for drawing significance threshold lines
    const minX = Math.min(...volcanoData.map(d => parseFloat(d.log2FC)).filter(x => !isNaN(x)));
    const maxX = Math.max(...volcanoData.map(d => parseFloat(d.log2FC)).filter(x => !isNaN(x)));

    // Define significance threshold lines for the plot
    const shapes = [
        // Horizontal line marking p-value significance threshold (typically p = 0.05)
        {
            type: 'line',
            x0: minX,  // Extend across full x-axis range
            x1: maxX,
            y0: pvalY,  // Y position: -log10(0.05) ≈ 1.3
            y1: pvalY,
            line: {
                color: 'black',
                width: 1,
                dash: 'dash'  // Dashed line style
            }
        }
    ];

    // Add vertical fold change threshold lines if threshold is set
    if (threshold !== null && !isNaN(threshold)) {
        const maxY = Math.max(...volcanoData.map(d => -Math.log10(parseFloat(d.pval))).filter(y => !isNaN(y)));

        shapes.push(
            {
                type: 'line',  // Positive fold change threshold line
                x0: threshold,
                x1: threshold,
                y0: 0,
                y1: maxY,  // Extend to maximum y-value
                line: {
                    color: 'black',
                    width: 1,
                    dash: 'dot'  // Dotted line style
                }
            },
            {
                type: 'line',  // Negative fold change threshold line
                x0: -threshold,
                x1: -threshold,
                y0: 0,
                y1: maxY,  // Extend to maximum y-value
                line: {
                    color: 'black',
                    width: 1,
                    dash: 'dot'  // Dotted line style
                }
            }
        );
    }

    // Configure plot layout and styling.
    //
    // Two layout traps Plotly springs after newPlot resolves:
    //
    // 1. autosize observer — fires when the SVG size differs from the container.
    //    Disabled with autosize:false + explicit width/height.
    //
    // 2. auto-margin pass — Plotly initially renders with the user margin, then
    //    measures tick labels and axis titles and expands margins to fit them.
    //    Because newPlot's promise resolves BEFORE this pass, .then() reveals the
    //    plot at its first-paint coordinates; the auto-margin pass then runs and
    //    shrinks the plot area, snapping data-coord shapes (the dashed threshold
    //    lines) and axis titles downward. Disabled with margin.autoexpand:false
    //    plus pre-allocated l/r/t/b values that already accommodate the labels.
    const volcanoEl = document.getElementById('volcano');
    const containerWidth = volcanoEl ? volcanoEl.clientWidth : 800;
    const layout = {
        xaxis: { title: 'log2 Fold Change' },
        yaxis: { title: '-log10(p-value)' },
        margin: { l: 70, r: 30, t: 30, b: 60, autoexpand: false },
        shapes: shapes,
        autosize: false,
        width: containerWidth,
        height: 500,
    };

    // Render the volcano plot using Plotly.js.
    // HTMX outerHTML swap leaves Plotly's internal state attached to detached DOM
    // nodes; without a full purge the next render duplicates axes, clusters the
    // modebar in the wrong corner, and overflows into adjacent UI. Purge then
    // newPlot fully tears down and rebuilds. No `responsive:true` — the container
    // has fixed dimensions (width:100%; height:500px) so resize listeners just
    // accumulate and cause layout drift on each HTMX swap.
    (function renderVolcano() {
        if (!volcanoEl) return;
        // Hide the plot during render — Plotly does an internal layout pass after first
        // paint that briefly leaves shapes (dashed threshold lines, axis titles) at
        // stale pixel coordinates while the axes reposition. Hiding until plotly_afterplot
        // fires keeps the user from seeing the transient drift.
        volcanoEl.style.visibility = 'hidden';
        try { Plotly.purge(volcanoEl); } catch (_) {}

        // Double-rAF defers measurement past the swap-in layout commit so Plotly
        // reads the final container dimensions on first try.
        requestAnimationFrame(function () {
            requestAnimationFrame(function () {
                // Re-measure after layout has settled.
                layout.width = volcanoEl.clientWidth;
                Plotly.newPlot(volcanoEl, [trace], layout, {
                    displayModeBar: 'hover',
                    responsive: false,
                }).then(function () {
                    // After Plotly's render + post-render layout pass completes, reveal.
                    volcanoEl.style.visibility = 'visible';
                }).catch(function () {
                    volcanoEl.style.visibility = 'visible';
                });
            });
        });
    })();
    {% endif %}
    })();
</script>

<script>
// IIFE so this re-runs every time the partial is swapped in via HTMX (DOMContentLoaded only fires once).
(function () {
    const form = document.getElementById("enrichmentForm");
    const spinner = document.getElementById("loadingSpinner");

    if (form && spinner) {
        form.addEventListener("submit", function () {
            spinner.style.display = "block";
        });
    }

    function copyMetadataToForms() {
        const metadataFields = ['dataset_id', 'owner', 'stressor', 'dosing', 'description'];
        metadataFields.forEach(fieldName => {
            const sourceField = document.getElementById(fieldName);
            if (sourceField) {
                const hiddenFields = document.querySelectorAll(`input[name="${fieldName}"][type="hidden"]`);
                hiddenFields.forEach(hiddenField => {
                    hiddenField.value = sourceField.value;
                });
            }
        });
    }

    // Sync metadata into every form's hidden fields just before submit (native + HTMX).
    const forms = document.querySelectorAll('#single-analysis-panel form');
    forms.forEach(f => {
        f.addEventListener('submit', copyMetadataToForms);
        f.addEventListener('htmx:configRequest', copyMetadataToForms);
    });

    const metadataInputs = document.querySelectorAll('#metadataForm input, #metadataForm textarea');
    metadataInputs.forEach(input => {
        input.addEventListener('change', copyMetadataToForms);
        input.addEventListener('input', copyMetadataToForms);
    });
})();

// IIFE: toggle #threshold-inputs visibility/disabled state based on method radio,
// and keep the hidden #method-mirror / #pval-mirror inputs in #enrichmentForm
// in sync with the user's radio + pval threshold choices. Re-runs on every
// HTMX partial swap because the partial reloads this whole <script> block.
(function () {
    const radios = document.querySelectorAll('input[name="method"]');
    const wrapper = document.getElementById('threshold-inputs');
    if (!radios.length || !wrapper) return;

    const methodMirror = document.getElementById('method-mirror');
    const pvalMirror = document.getElementById('pval-mirror');
    const pvalInput = document.getElementById('pval_threshold');
    // The log2FC box needs the same mirror as the p-value box. Without it,
    // typing a custom threshold and pressing "Run Enrichment Analysis" without
    // first pressing "Update Plot" ran the analysis on the *previous* threshold
    // while the box on screen showed the new one — wrong numbers, no error.
    const logfcMirror = document.getElementById('logfc-mirror');
    const logfcInput = document.getElementById('logfc_threshold');

    function applyMethod() {
        const selected = document.querySelector('input[name="method"]:checked');
        const isGsea = selected && selected.value === 'gsea';
        wrapper.style.display = isGsea ? 'none' : '';
        wrapper.querySelectorAll('input').forEach(i => { i.disabled = isGsea; });
        if (methodMirror && selected) methodMirror.value = selected.value;
        if (pvalMirror && pvalInput) pvalMirror.value = pvalInput.value;
        if (logfcMirror && logfcInput) logfcMirror.value = logfcInput.value;
    }

    radios.forEach(r => r.addEventListener('change', applyMethod));
    if (pvalInput) {
        pvalInput.addEventListener('input', () => {
            if (pvalMirror) pvalMirror.value = pvalInput.value;
        });
    }
    if (logfcInput) {
        logfcInput.addEventListener('input', () => {
            if (logfcMirror) logfcMirror.value = logfcInput.value;
        });
    }
    applyMethod();
})();

// IIFE: keep the gene-set resource selection alive across "Update Plot" (#55).
// The resource checkboxes live in #enrichmentForm, but Update Plot submits
// #volcanoForm, so mirror the checked resources into hidden inputs on
// #volcanoForm. /preview echoes them back via selected_resources, so the boxes
// stay checked after the HTMX swap. Re-runs on every partial swap.
(function () {
    const volcanoForm = document.getElementById('volcanoForm');
    const checkboxes = document.querySelectorAll('input[name="resources"]');
    if (!volcanoForm || !checkboxes.length) return;

    function syncResources() {
        volcanoForm.querySelectorAll('input[data-resource-mirror]').forEach(el => el.remove());
        checkboxes.forEach(cb => {
            if (cb.checked) {
                const hidden = document.createElement('input');
                hidden.type = 'hidden';
                hidden.name = 'resources';
                hidden.value = cb.value;
                hidden.setAttribute('data-resource-mirror', '');
                volcanoForm.appendChild(hidden);
            }
        });
    }

    checkboxes.forEach(cb => cb.addEventListener('change', syncResources));
    syncResources();
})();

// IIFE: keep the minimum mapping-confidence selection alive across "Update
// Plot" (#60). Same mirroring trick as the resource checkboxes above — the
// select lives in #enrichmentForm, so its value is copied into a hidden input
// on #volcanoForm; /preview echoes it back via min_confidence.
(function () {
    const volcanoForm = document.getElementById('volcanoForm');
    const select = document.getElementById('min_confidence');
    if (!volcanoForm || !select) return;

    function syncMinConfidence() {
        volcanoForm.querySelectorAll('input[data-min-confidence-mirror]').forEach(el => el.remove());
        const hidden = document.createElement('input');
        hidden.type = 'hidden';
        hidden.name = 'min_confidence';
        hidden.value = select.value;
        hidden.setAttribute('data-min-confidence-mirror', '');
        volcanoForm.appendChild(hidden);
    }

    select.addEventListener('change', syncMinConfidence);
    syncMinConfidence();
})();

// Globals exposed for inline onclick handlers in _single_analysis.html.
function setThreshold(value) {
    document.getElementById('logfc_threshold').value = value;
    // requestSubmit() fires a real submit event so HTMX intercepts it (form.submit() bypasses listeners).
    document.getElementById('volcanoForm').requestSubmit();
}

function setPercentageThreshold(percentage) {
    // Issue #64: read the server-computed threshold rather than recomputing it
    // from volcanoData, which is truncated to Config.MAX_GENES_DISPLAY.
    const percentiles = window.logfcPercentiles || {};
    const threshold = percentiles[percentage];

    if (threshold === undefined || threshold === null) {
        alert('Please load a dataset first to use percentage-based thresholds.');
        return;
    }

    document.getElementById('logfc_threshold').value = threshold;
    document.getElementById('volcanoForm').requestSubmit();
}
</script>

<script>
// Drag-and-drop upload zone
(function() {
    var dropZone = document.getElementById('upload-drop-zone');
    var fileInput = document.getElementById('file-input-hidden');
    var submitBtn = document.getElementById('upload-submit-btn');

    if (!dropZone || !fileInput) return;

    // Click to browse
    dropZone.addEventListener('click', function(e) {
        if (e.target.id === 'drop-zone-remove') return;
        fileInput.click();
    });

    // Keyboard accessibility
    dropZone.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            fileInput.click();
        }
    });

    // Drag-over feedback
    dropZone.addEventListener('dragover', function(e) {
        e.preventDefault();
        dropZone.classList.add('drop-zone--active');
    });
    dropZone.addEventListener('dragleave', function() {
        dropZone.classList.remove('drop-zone--active');
    });

    // Drop handler
    dropZone.addEventListener('drop', function(e) {
        e.preventDefault();
        dropZone.classList.remove('drop-zone--active');
        var file = e.dataTransfer.files[0];
        if (file) setFile(file);
    });

    // File input change handler
    fileInput.addEventListener('change', function() {
        if (fileInput.files[0]) setFile(fileInput.files[0]);
    });

    function setFile(file) {
        // Transfer to DataTransfer to set on hidden input
        var dt = new DataTransfer();
        dt.items.add(file);
        fileInput.files = dt.files;

        document.getElementById('drop-zone-filename').textContent = file.name;
        document.getElementById('drop-zone-filename').hidden = false;
        document.getElementById('drop-zone-remove').hidden = false;
        if (submitBtn) submitBtn.disabled = false;
    }

    document.getElementById('drop-zone-remove').addEventListener('click', function(e) {
        e.stopPropagation();
        fileInput.value = '';
        document.getElementById('drop-zone-filename').hidden = true;
        document.getElementById('drop-zone-remove').hidden = true;
        if (submitBtn) submitBtn.disabled = true;
    });

    // Ensure metadata is copied into the upload form before submit
    var uploadForm = document.getElementById('uploadForm');
    if (uploadForm) {
        uploadForm.addEventListener('submit', function() {
            var metadataFields = ['dataset_id', 'owner', 'stressor', 'dosing', 'description'];
            metadataFields.forEach(function(fieldName) {
                var source = document.getElementById(fieldName);
                if (source) {
                    var hidden = uploadForm.querySelector('input[name="' + fieldName + '"]');
                    if (hidden) hidden.value = source.value;
                }
            });
        });
    }
})();
</script>

<script>
// AOP typeahead search — queries /api/aops as user types or on focus.
// Phase 10.1 (D-06): supports a recommended-only filter mode driven by `recommended_aops` from the server.
(function () {
    const searchInput = document.getElementById('aop_search');
    const hiddenInput = document.getElementById('aop_selection');
    const suggestions = document.getElementById('aop_suggestions');
    if (!searchInput || !hiddenInput || !suggestions) return;

    // ---- Phase 10.1 filter state ----
    const dataNode = document.getElementById('recommended-aops-data');
    const recommendedAops = dataNode ? JSON.parse(dataNode.textContent || '[]') : [];
    const filterModeInput = document.getElementById('aop_filter_mode');
    const filterBtn = document.getElementById('aop_filter_btn');
    const filterLabel = document.getElementById('aop_filter_label');

    function getFilterMode() {
        if (!filterModeInput) return 'all';
        return filterModeInput.value === 'recommended' ? 'recommended' : 'all';
    }

    /**
     * Mirror the AOP picker into #volcanoForm so it survives "Update Plot".
     *
     * The picker lives in #enrichmentForm, but the threshold controls submit
     * #volcanoForm — the same split that made the resource checkboxes (#55) and
     * the confidence select (#60) need mirrors. Without one, /preview re-rendered
     * the picker empty and the recommended-AOP auto-select below treated that as
     * "never chosen", silently replacing a manual pick with the demo's AOP on
     * every threshold change. The label is mirrored too because only the browser
     * knows it: the server has the AOP id, not its display text.
     *
     * Called from every place that mutates the picker rather than on submit,
     * because the hidden input is set by script and never fires a change event.
     *
     * The hidden inputs alone are not enough: anything that sets the picker
     * without going through those call sites (tour.js's preselectPxrAop, say)
     * would leave them stale. So the values are also written into the request
     * at htmx:configRequest below, which is authoritative whoever set them.
     */
    function aopMirrorValues() {
        const values = {
            aop_selection: hiddenInput.value,
            aop_label: searchInput.value
        };
        if (filterModeInput) values.aop_filter_mode = filterModeInput.value;
        return values;
    }

    function syncAopMirror() {
        const volcanoForm = document.getElementById('volcanoForm');
        if (!volcanoForm) return;  // not mounted until columns are confirmed
        volcanoForm.querySelectorAll('input[data-aop-mirror]').forEach(el => el.remove());
        Object.entries(aopMirrorValues()).forEach(([name, value]) => {
            const hidden = document.createElement('input');
            hidden.type = 'hidden';
            hidden.name = name;
            hidden.value = value;
            hidden.setAttribute('data-aop-mirror', '');
            volcanoForm.appendChild(hidden);
        });
    }

    // Authoritative sync: htmx has already gathered the form's parameters by
    // this point, and mutating evt.detail.parameters is its supported extension
    // point — so this lands the *current* picker state no matter which code path
    // set it, and regardless of listener ordering. The hidden inputs above stay
    // for the non-htmx fallback submit.
    (function attachAopConfigSync() {
        const volcanoForm = document.getElementById('volcanoForm');
        if (!volcanoForm) return;
        volcanoForm.addEventListener('htmx:configRequest', function (evt) {
            Object.entries(aopMirrorValues()).forEach(([name, value]) => {
                evt.detail.parameters[name] = value;
            });
        });
    })();

    function applyRecommendedFilter(aops) {
        if (getFilterMode() !== 'recommended' || recommendedAops.length === 0) return aops;
        // Recommended set may include 'NETWORK:kidney' which is not a standard AOP:N id —
        // /api/aops returns AOP:N entries, so NETWORK:* sentinels never match. That is intentional:
        // the kidney network is reachable via the existing CASE_STUDY_AOPS dropdown elsewhere.
        const set = new Set(recommendedAops);
        return aops.filter(a => set.has(a.aop_id));
    }

    let debounceTimer;

    /**
     * Human-readable resource names for the coverage breakdown (#105).
     */
    const RESOURCE_LABELS = {
        WikiPathways: 'WikiPathways',
        GO_BP: 'GO BP',
        Reactome: 'Reactome'
    };

    /**
     * Describe which resources contribute an AOP's KE coverage (#105).
     *
     * The headline number is the union across WikiPathways, GO BP and
     * Reactome, so it cannot show that (say) a single KE is covered by GO
     * alone. This breakdown does. Returns '' for entries with no breakdown —
     * the Builder-only and configured-AOP tiers, where per-resource numbers
     * would be invented rather than measured.
     *
     * @param {Object} aop - AOP dict from /api/aops
     * @returns {string} e.g. "WikiPathways 6, GO BP 1, Reactome 0"
     */
    function coverageBreakdown(aop) {
        const counts = aop.mapped_ke_by_resource;
        if (!counts) return '';
        return Object.keys(RESOURCE_LABELS)
            .filter(key => counts[key] !== undefined)
            .map(key => `${RESOURCE_LABELS[key]} ${counts[key]}`)
            .join(', ');
    }

    /**
     * Format a single AOP object into a human-readable label.
     *
     * #105: the coverage figure counts KEs with a gene set in any resource,
     * not just WikiPathways, and says "have gene sets" rather than "mapped" —
     * and deliberately not "testable", since no dataset has been uploaded yet
     * and so nothing here knows how many of a KE's genes were measured.
     *
     * @param {Object} aop - AOP dict from /api/aops
     * @returns {string}
     */
    function formatLabel(aop) {
        const mappedInfo = aop.mapped_ke_count > 0
            ? ` -- ${aop.mapped_ke_count}/${aop.ke_count} KEs have gene sets`
            : '';
        return `${aop.aop_id}: ${aop.title} (${aop.ke_count} KEs${mappedInfo})`;
    }

    /**
     * Render a list of AOP objects (or an error dict) as dropdown items.
     * @param {Array|Object} aops - Array of AOP dicts or {error: string}
     */
    function renderSuggestions(aops) {
        suggestions.innerHTML = '';

        // Handle error response
        if (!Array.isArray(aops) && aops.error) {
            const li = document.createElement('li');
            li.textContent = aops.error;
            li.style.color = '#EB5B25';
            li.style.cursor = 'default';

            const retryBtn = document.createElement('button');
            retryBtn.textContent = 'Retry';
            retryBtn.type = 'button';
            retryBtn.style.marginLeft = '10px';
            retryBtn.style.fontSize = '12px';
            retryBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                fetchSuggestions(searchInput.value);
            });
            li.appendChild(retryBtn);
            suggestions.appendChild(li);
            suggestions.hidden = false;
            return;
        }

        const filtered = applyRecommendedFilter(Array.isArray(aops) ? aops : []);
        if (filtered.length === 0) {
            suggestions.hidden = true;
            return;
        }

        filtered.forEach(function (aop) {
            const li = document.createElement('li');

            // Main label: AOP ID and title
            const mainText = document.createElement('span');
            mainText.textContent = `${aop.aop_id}: ${aop.title} (${aop.ke_count} KEs)`;
            li.appendChild(mainText);

            // Mapping info badge. The per-resource breakdown rides along as a
            // tooltip so the union count can be traced to its sources (#105).
            if (aop.mapped_ke_count > 0) {
                const info = document.createElement('span');
                info.className = 'mapped-info';
                info.textContent = ` -- ${aop.mapped_ke_count}/${aop.ke_count} KEs have gene sets`;
                const breakdown = coverageBreakdown(aop);
                if (breakdown) {
                    info.title = `Key Events with gene sets, by resource: ${breakdown}`;
                }
                li.appendChild(info);
            }

            // Phase 10.1: highlight recommended AOPs with the blue left border (UI-SPEC §Color).
            if (recommendedAops.indexOf(aop.aop_id) !== -1) {
                li.classList.add('aop-recommended');
            }

            li.dataset.id = aop.aop_id;

            li.addEventListener('click', function () {
                hiddenInput.value = aop.aop_id;
                searchInput.value = formatLabel(aop);
                suggestions.hidden = true;
                syncAopMirror();
            });

            suggestions.appendChild(li);
        });

        suggestions.hidden = false;
    }

    /**
     * Fetch AOP suggestions from the server.
     * In recommended mode, passes the recommended IDs as `ids=` so the API
     * force-includes case-study AOPs (e.g. AOP:1) that have no KE-gene mappings
     * and would otherwise be excluded from the default mapped-only response.
     * @param {string} q - Search query (may be empty for on-focus defaults)
     */
    async function fetchSuggestions(q) {
        try {
            const params = new URLSearchParams({ q: q || '' });
            if (getFilterMode() === 'recommended' && recommendedAops.length > 0) {
                params.set('ids', recommendedAops.join(','));
            }
            const res = await fetch(`/api/aops?${params.toString()}`);
            if (!res.ok) {
                let errMsg = 'Failed to load AOPs';
                try {
                    const err = await res.json();
                    errMsg = err.error || errMsg;
                } catch (_) {}
                renderSuggestions({ error: errMsg });
                return;
            }
            const aops = await res.json();
            renderSuggestions(aops);
        } catch (err) {
            renderSuggestions({ error: 'Network error. Please check your connection.' });
        }
    }

    // On focus: show mapped AOPs immediately (empty query returns mapped AOPs)
    searchInput.addEventListener('focus', function () {
        fetchSuggestions('');
    });

    // On input: debounced search
    searchInput.addEventListener('input', function () {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(function () {
            fetchSuggestions(searchInput.value);
        }, 250);
    });

    // Close suggestions when clicking outside the typeahead wrapper
    document.addEventListener('click', function (e) {
        if (!e.target.closest('.typeahead-wrapper')) {
            suggestions.hidden = true;
        }
    });

    // ---- Phase 10.1 filter toggle (D-06 sticky behavior) ----
    if (filterBtn && filterLabel && filterModeInput) {
        // Restore label from current mode (handles HTMX re-renders where mode was 'all').
        function syncLabel() {
            if (getFilterMode() === 'all') {
                filterLabel.textContent = 'Showing all AOPs';
                filterBtn.textContent = 'Hide all';
            } else {
                filterLabel.textContent = 'Showing recommended AOPs for this demo';
                filterBtn.textContent = 'Show all AOPs';
            }
        }
        filterBtn.addEventListener('click', function () {
            filterModeInput.value = (getFilterMode() === 'all') ? 'recommended' : 'all';
            syncLabel();
            syncAopMirror();
            // Refresh the dropdown so the new mode applies.
            fetchSuggestions(searchInput.value || '');
        });
        syncLabel();
    }

    // Auto-select the recommended AOP when there is exactly one. The demo CTA
    // on /demos already POSTs recommended_aops, so curators landing on /preview
    // via a demo expect the picker to be pre-filled with the recommended AOP
    // rather than having to re-pick it. Only kicks in when the picker is empty
    // (so we never clobber a manual selection on HTMX re-render).
    if (recommendedAops.length === 1 && !hiddenInput.value && !searchInput.value) {
        const wantedId = recommendedAops[0];
        // Skip NETWORK:* sentinels — they aren't returned by /api/aops as a
        // single AOP and are reached through the case-study dropdown instead.
        if (!wantedId.startsWith('NETWORK:')) {
            const params = new URLSearchParams({ ids: wantedId });
            fetch(`/api/aops?${params.toString()}`)
                .then(function (res) { return res.ok ? res.json() : []; })
                .then(function (aops) {
                    const match = Array.isArray(aops)
                        ? aops.find(function (a) { return a.aop_id === wantedId; })
                        : null;
                    if (match && !hiddenInput.value) {
                        hiddenInput.value = match.aop_id;
                        searchInput.value = formatLabel(match);
                        syncAopMirror();
                    }
                })
                .catch(function () { /* silent: user can still pick manually */ });
        }
    }

    // Seed the mirror from whatever the server just rendered, so a re-render
    // that happens before the user touches the picker still carries it forward.
    syncAopMirror();
})();
</script>
